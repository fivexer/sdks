name: java

on:
  push:
    paths:
      - java/**
      - contract/**
      - .github/workflows/java.yml
  pull_request:
    paths:
      - java/**

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.java }}-${{ hashFiles('java/**/*.gradle') }}
      - name: Build, test, verify coverage (90% line + branch)
        working-directory: java
        run: ./gradlew check --no-daemon
      - name: Fail if any test is skipped
        working-directory: java
        run: |
          if grep -rn "@Disabled\|@Ignore\|assumeTrue\|assumingThat" src/test/; then
            echo "::error::skipped tests are not allowed"
            exit 1
          fi
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}-jdk${{ matrix.java }}
          path: java/build/reports/jacoco/

  release:
    # Publish to Maven Central Portal on tag push. Requires CENTRAL_PORTAL_* + signing secrets.
    needs: test
    if: startsWith(github.ref, 'refs/tags/java-v')
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.fivexer/fivexer-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Publish to Maven Central Portal
        working-directory: java
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenLocal sign publish --no-daemon
