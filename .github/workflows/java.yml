name: java

on:
  push:
    paths:
      - java/**
      - contract/**
      - .github/workflows/java.yml
  pull_request:
    paths:
      - java/**

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell, which cannot parse `if grep ...` — and, worse,
        # only propagates the LAST command's exit code in a multi-line `run:`, so a failing test
        # suite followed by a passing gate script reported success. Git Bash ships on the Windows
        # image and GitHub invokes it with `-eo pipefail`, so every command's failure is fatal.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.java }}-${{ hashFiles('java/**/*.gradle') }}
      - name: Build, test, verify coverage (90% line + branch)
        working-directory: java
        run: ./gradlew check --no-daemon
      # Greps the checked-out source, which is byte-identical on every matrix leg — one run
      # answers for all of them, so this does not need to fan out across the OS/version grid.
      - name: Fail if any test is skipped
        if: runner.os == 'Linux'
        working-directory: java
        run: |
          if grep -rn "@Disabled\|@Ignore\|assumeTrue\|assumingThat" src/test/; then
            echo "::error::skipped tests are not allowed"
            exit 1
          fi
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-${{ matrix.os }}-jdk${{ matrix.java }}
          path: java/build/reports/jacoco/

  release:
    # Publish to Maven Central on tag push.
    #
    # Unlike Packagist (which reads a git repo), Central is push-based: it never sees this
    # repository, only an uploaded bundle. That is why the Java SDK needs no special repo layout
    # despite living in a subdirectory — and why publishing is an explicit HTTP upload rather
    # than a `gradle publish` to a remote URL. The Central Portal has no deploy URL for
    # releases; `maven-snapshots` accepts only -SNAPSHOT versions.
    needs: test
    if: startsWith(github.ref, 'refs/tags/java-v')
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/com.fivexer/fivexer-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the tag matches the built version
        working-directory: java
        run: |
          # Nothing cross-checks the tag against build.gradle, so a java-v0.4.0 tag on a tree
          # that still says 0.3.0 would publish 0.3.0 — or, worse, re-publish a version Central
          # already has. Maven Central is immutable: a released coordinate can never be replaced.
          TAG="${GITHUB_REF#refs/tags/java-v}"
          BUILT="$(./gradlew properties --no-daemon -q | awk '$1=="version:"{print $2}')"
          if [ "$TAG" != "$BUILT" ]; then
            echo "::error::tag java-v$TAG does not match build.gradle version $BUILT"
            exit 1
          fi
          echo "releasing $TAG"

      - name: Build the signed Central bundle
        working-directory: java
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew centralBundle --no-daemon

      - name: Upload to the Central Portal Publisher API
        working-directory: java
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          V="${GITHUB_REF#refs/tags/java-v}"
          BUNDLE="build/central/fivexer-sdk-${V}-bundle.zip"
          # The signatures are the point of the whole exercise; Central rejects an unsigned
          # bundle, but it is better to find a missing secret here than in a 400 from the API.
          if ! unzip -l "$BUNDLE" | grep -q '\.jar\.asc$'; then
            echo "::error::bundle is unsigned — is SIGNING_KEY set?"
            exit 1
          fi
          # Lengths only — never the values. A secret pasted with a trailing newline, or one that
          # silently stored empty because `--body "$VAR"` was given an unset variable, is
          # invisible in the portal and indistinguishable from a wrong password in the 401. This
          # is the cheapest way to tell those apart on the next run.
          echo "username length: ${#CENTRAL_PORTAL_USERNAME}, token length: ${#CENTRAL_PORTAL_TOKEN}"
          if [ -z "$CENTRAL_PORTAL_USERNAME" ] || [ -z "$CENTRAL_PORTAL_TOKEN" ]; then
            echo "::error::a Central Portal secret is empty"
            exit 1
          fi
          # Strip whitespace before encoding. A newline caught in the paste ends up inside the
          # base64 payload, so the server decodes a username that does not exist and answers
          # "Invalid token" — the same message a genuinely wrong password gets.
          U="$(printf '%s' "$CENTRAL_PORTAL_USERNAME" | tr -d '[:space:]')"
          T="$(printf '%s' "$CENTRAL_PORTAL_TOKEN" | tr -d '[:space:]')"
          AUTH="$(printf '%s:%s' "$U" "$T" | base64 -w0)"
          # publishingType=AUTOMATIC releases once validation passes. USER_MANAGED would park the
          # deployment in the portal waiting for someone to click, which in CI just means a
          # release that silently never happened.
          CODE="$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${AUTH}" \
            -F "bundle=@${BUNDLE}" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=fivexer-sdk-${V}&publishingType=AUTOMATIC")"
          echo "HTTP ${CODE}"; cat response.txt; echo
          case "$CODE" in
            2*) echo "deployment accepted" ;;
            *) echo "::error::Central Portal rejected the upload"; exit 1 ;;
          esac
