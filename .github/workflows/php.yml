name: php

on:
  push:
    paths:
      - php/**
      # The manifest lives at the repo root because Packagist only ever reads a root
      # composer.json — see the comment on it. A dependency bump has to trigger PHP CI, and it no
      # longer lives under php/.
      - composer.json
      - composer.lock
      - contract/**
      - .github/workflows/php.yml
  pull_request:
    paths:
      - php/**
      - composer.json
      - composer.lock
      - contract/**

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell, which cannot parse `if grep ...` — and, worse,
        # only propagates the LAST command's exit code in a multi-line `run:`, so a failing test
        # suite followed by a passing gate script reported success. Git Bash ships on the Windows
        # image and GitHub invokes it with `-eo pipefail`, so every command's failure is fatal.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Xdebug is PINNED, and only on the legs that measure coverage. setup-php resolves a
          # bare `xdebug` to the newest build it can find, which on PHP >= 8.2 became the
          # 3.6.0alpha1 pre-release: it still records lines correctly (97.7%) but loses roughly
          # half of the executed *branches* (1540/1635 under 3.5.3 vs 830/1635 under 3.6.0a1 on
          # the same commit, with the executable-branch count unchanged), which fails the 90%
          # branch gate for reasons that have nothing to do with the code under test. Pinning a
          # stable release keeps every leg measuring the same thing. Revisit once 3.6 is stable.
          # `add_extension` short-circuits when the extension is already loaded, so the pinned
          # build survives the `coverage: xdebug` step below — that step then only sets
          # xdebug.mode (which is INI_SYSTEM, so phpunit.xml cannot set it).
          extensions: curl, json, mbstring${{ runner.os == 'Linux' && ', xdebug-3.5.3' || '' }}
          # The line-only coverage drivers cannot feed the branch gate. Coverage is enabled only
          # where the gate runs (see below) — on Windows it is dead weight, and Xdebug's
          # ~170ms-per-test instrumentation is the last thing the slower runner needs.
          coverage: ${{ runner.os == 'Linux' && 'xdebug' || 'none' }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs at the repo root: that is where composer.json is, and `config.vendor-dir` puts the
      # installed packages at php/vendor anyway — so every path inside php/ (phpunit.xml,
      # tests/bootstrap.php, bin/check-coverage.php) is unchanged by the manifest's location.
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Two runs on purpose. Xdebug's branch/path collection adds a fixed ~170ms of
      # post-processing to EVERY test, which measures the profiler rather than the test — so the
      # per-test time budget is checked on an uninstrumented run, and the coverage gate gets its
      # own instrumented run.
      # PHPUnit is invoked through `php <entrypoint>` rather than the `vendor/bin` proxy:
      # Composer writes a *nix shell script there beside a `.bat`, and which one Git Bash
      # resolves on the Windows runner is not worth leaving to chance in CI.
      - name: Test and enforce the per-test time budget (200ms)
        working-directory: php
        run: |
          php vendor/phpunit/phpunit/phpunit --no-coverage --log-junit build/junit.xml
          php bin/check-timings.php build/junit.xml 0.2

      # Linux only, for one reason: a coverage percentage is a property of the code, not of the
      # operating system it was measured on, so eight legs measuring the same number buys
      # nothing — and Xdebug's instrumentation roughly doubles the run to produce it.
      #
      # Windows still runs the whole suite, uninstrumented, in the step above. That is the part
      # that is genuinely OS-dependent: path handling, process startup, line endings, the time
      # budget. Windows failing to upload a coverage artifact was a *symptom* of the job dying
      # earlier at the parity test, not evidence about coverage — see .gitattributes.
      - name: Coverage gate (90% line + branch)
        if: runner.os == 'Linux'
        working-directory: php
        run: |
          php vendor/phpunit/phpunit/phpunit
          php bin/check-coverage.php

      # Greps the checked-out source, which is byte-identical on every matrix leg — one run
      # answers for all of them, so this does not need to fan out across the OS/version grid.
      - name: Fail if any test is skipped
        if: runner.os == 'Linux'
        working-directory: php
        run: |
          if grep -rn "markTestSkipped\|markTestIncomplete\|#\[Group('skip')\]" tests/; then
            echo "::error::skipped tests are not allowed"
            exit 1
          fi

      # `always()` so a failed gate still uploads the report that explains it — but only on the
      # legs that produce one, or the other legs warn about an empty path on every run.
      - name: Upload coverage report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: php-coverage-${{ matrix.os }}-php${{ matrix.php }}
          path: php/build/coverage/

  release:
    # Packagist is pull-based: it never receives an upload, it reads this repository's git tags.
    # So there is nothing here to publish with — this job's whole purpose is to guard the tag
    # before Packagist sees it. A tag is effectively immutable once crawled: Packagist caches a
    # version's metadata on first sight, and deleting the tag afterwards does not reliably
    # unpublish it.
    #
    # The filter is `v*`, not `php-v*`, and that is forced rather than chosen. Composer's version
    # parser rejects a tag it cannot normalise, so `php-v0.1.0` would be skipped with "invalid
    # version format" and the release would silently not exist. PHP therefore owns the
    # unprefixed tag namespace in this monorepo. The same rule is why `python-v0.4.0` and
    # `java-v*` tags are invisible to Packagist and cannot pollute this package's version list.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json, mbstring
      - name: Validate composer.json
        run: composer validate --strict

      - name: Check the tag agrees with the branch alias
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::a release tag must carry a full semver, got 'v$VERSION'"; exit 1 ;;
          esac
          # `extra.branch-alias.dev-main` tells Composer which line dev-main represents. Left
          # stale it does not fail anything loudly — it just resolves dev-main to the wrong
          # version for anyone tracking it, which is the kind of bug nobody reports.
          ALIAS="$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["extra"]["branch-alias"]["dev-main"] ?? "";')"
          EXPECTED="${VERSION%.*}.x-dev"
          if [ "$ALIAS" != "$EXPECTED" ]; then
            echo "::error::tag v$VERSION expects branch-alias dev-main = $EXPECTED, found '$ALIAS'"
            exit 1
          fi
          echo "releasing $VERSION (dev-main -> $ALIAS)"
