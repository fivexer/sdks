        meter: { period: "2026-07", matchedTasks: 0, includedTasksPerMonth: 1000 }
        matching: { fairness: first-come, maxTasksPerWindow: null, windowMs: null }

  # ---- tasks: operator + dry-run ----
  - name: assign_task_from_queue
    operation: tasks.assign
    method: POST
    path: /tasks/task_8fk2/assign
    request: { body: { workerId: agent_1 } }
    response:
      status: 200
      body: { id: task_8fk2, status: pending, workerId: agent_1, previousWorkerId: null }

  - name: assign_task_reassignment_reports_previous_worker
    operation: tasks.assign
    method: POST
    path: /tasks/task_8fk2/assign
    request: { body: { workerId: agent_2, force: true } }
    response:
