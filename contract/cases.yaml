    path: /skills/skl_1
    request: { body: { name: "Refunds & credits" } }
    response:
      status: 200
      body: { id: skl_1, key: refunds, name: "Refunds & credits", description: null, createdAt: "2026-07-24T10:00:00.000Z" }

  - name: remove_skill
    operation: skills.remove
