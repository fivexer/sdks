    method: GET
    path: /decisions?taskId=task_8fk2
    response:
      status: 200
      body:
        decisions:
          - { id: dec_1, taskId: task_8fk2, workerId: agent_1, matchedAt: 1750000000000, mode: best-match, candidates: [{ workerId: agent_1 }] }

  # ---- stats ----
