        title: "Refund request"
        description: null
        context: null
        references: [{ id: ref_1, url: "https://crm.example/o/41", label: "Order 41" }]
        createdAt: 1750000000000
        updatedAt: 1750000900000

  - name: clear_task_context
    operation: tasks.context.clear
    method: DELETE
    path: /tasks/task_8fk2/context
    response: { status: 204, body: null }

  - name: add_comment_as_worker
    operation: tasks.comments.add
    method: POST
    path: /tasks/task_8fk2/comments
    request: { body: { body: "Called the customer back", workerId: agent_1 } }
    response:
      status: 201
      body:
        comment:
          id: cmt_1
          taskId: task_8fk2
          author: { type: worker, id: agent_1, label: "Ada" }
          body: "Called the customer back"
          createdAt: 1750001000000

  - name: list_comments_paginated
    operation: tasks.comments.list
    method: GET
    path: /tasks/task_8fk2/comments?limit=1
    response:
      status: 200
      body:
        comments:
          - { id: cmt_1, taskId: task_8fk2, author: { type: api, id: null, label: null }, body: "Escalated", createdAt: 1750001000000 }
        nextCursor: cursor_c1
        hasMore: true

  - name: remove_comment
    operation: tasks.comments.remove
    method: DELETE
    path: /tasks/task_8fk2/comments/cmt_1
    response: { status: 204, body: null }

  - name: create_attachment_returns_presigned_upload
    operation: tasks.attachments.create
    method: POST
    path: /tasks/task_8fk2/attachments
    request: { body: { filename: "receipt.pdf", contentType: application/pdf, sizeBytes: 20480 } }
    response:
      status: 201
      body:
        attachment:
          id: att_1
          taskId: task_8fk2
          filename: "receipt.pdf"
          contentType: application/pdf
          sizeBytes: 20480
          status: pending
          uploader: { type: api, id: null }
          createdAt: 1750001000000
          confirmedAt: null
        upload:
          url: "https://storage.example/bucket/att_1?sig=abc"
          method: PUT
          headers: { content-type: application/pdf }
          expiresAt: 1750004600000

  - name: confirm_attachment
    operation: tasks.attachments.confirm
    method: POST
    path: /tasks/task_8fk2/attachments/att_1/confirm
    response:
      status: 200
      body:
        attachment:
          id: att_1
          taskId: task_8fk2
          filename: "receipt.pdf"
          contentType: application/pdf
          sizeBytes: 20480
          status: ready
          uploader: { type: api, id: null }
          createdAt: 1750001000000
          confirmedAt: 1750001100000

  - name: list_attachments
    operation: tasks.attachments.list
    method: GET
    path: /tasks/task_8fk2/attachments
    response: { status: 200, body: { attachments: [] } }

  - name: download_attachment
    operation: tasks.attachments.download
    method: GET
    path: /tasks/task_8fk2/attachments/att_1/download
    response:
      status: 200
      body: { url: "https://storage.example/bucket/att_1?dl=1", expiresAt: 1750004600000 }

  - name: remove_attachment
    operation: tasks.attachments.remove
    method: DELETE
    path: /tasks/task_8fk2/attachments/att_1
    response: { status: 204, body: null }

  - name: attachments_unavailable_without_object_store
    operation: tasks.attachments.create
    method: POST
    path: /tasks/task_8fk2/attachments
    request: { body: { filename: "a.pdf", contentType: application/pdf, sizeBytes: 1 } }
    response:
      status: 501
      body: { error: { code: storage_unavailable, message: "object storage is not configured" } }

  # ---- workers: detail, patch, availability ----
