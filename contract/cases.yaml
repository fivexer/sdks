    method: POST
    path: /workers/agent_1/availability
    request: { body: { available: false } }
    response: { status: 200, body: { id: agent_1, available: false } }

  - name: pause_worker_releasing_backlog_returns_requeued_task_ids
    operation: workers.setAvailability
    method: POST
    path: /workers/agent_1/availability
    request: { body: { available: false, releaseBacklog: true } }
    response:
      status: 200
      body: { id: agent_1, available: false, releasedTaskIds: [task_8fk2, task_9aa3] }

  - name: resume_worker
    operation: workers.setAvailability
    method: POST
    path: /workers/agent_1/availability
    request: { body: { available: true } }
    response: { status: 200, body: { id: agent_1, available: true } }

  - name: release_backlog_on_resume_is_rejected
    operation: workers.setAvailability
    method: POST
    path: /workers/agent_1/availability
    request: { body: { available: true, releaseBacklog: true } }
    response:
      status: 400
      body: { error: { code: invalid_body, message: "releaseBacklog is only valid when pausing" } }

  # ---- skills ----
  - name: create_skill
    operation: skills.create
    method: POST
    path: /skills
    request: { body: { key: refunds, name: Refunds, description: "Handles refund requests" } }
    response:
      status: 201
      body: { id: skl_1, key: refunds, name: Refunds, description: "Handles refund requests", createdAt: "2026-07-24T10:00:00.000Z" }

  - name: list_skills_search
    operation: skills.list
    method: GET
    path: /skills?q=ref&limit=10
    response:
      status: 200
      body: { skills: [{ id: skl_1, key: refunds, name: Refunds, description: null, createdAt: "2026-07-24T10:00:00.000Z" }] }

  - name: patch_skill
    operation: skills.patch
