  # ---- worker portal plane (wt_ token) ----
  - name: worker_login_adopts_token_and_worker_id
    plane: worker
    operation: worker.login
    method: POST
    path: /worker-auth/login
    request: { body: { workspaceId: ws_1, workerId: agent_1, pin: "4821" } }
    response: { status: 200, body: { token: "wt_s3ss10n" } }
    notes: >-
      Sent without an Authorization header (no token yet). On success the client adopts both the
      token and the workerId from the request, so later calls need no explicit id.

  - name: worker_login_rejects_bad_pin
    plane: worker
    operation: worker.login
    method: POST
    path: /worker-auth/login
