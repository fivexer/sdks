  # ---- cross-cutting error shapes ----
  - name: rate_limited_carries_retry_after_and_quota
    operation: tasks.create
    method: POST
    path: /tasks
    request: { body: { tags: [x] } }
    response:
      status: 429
      headers: { retry-after: "60", x-quota-task-rate-limit: "300", x-quota-task-rate-remaining: "0" }
      body: { error: { code: rate_limited, message: "task creation rate above 300/min" } }

  - name: plan_limit_carries_quota
    operation: tasks.create
    method: POST
    path: /tasks
    request: { body: { tags: [x] } }
    response:
      status: 402
      headers: { x-quota-queued-tasks-limit: "50000", x-quota-queued-tasks-remaining: "0" }
      body: { error: { code: plan_limit_exceeded, message: "queued task limit of 50000 reached" } }

  - name: validation_failed
    operation: tasks.create
    method: POST
    path: /tasks
    request: { body: {} }
    response:
      status: 400
      body: { error: { code: validation_failed, message: "body must have required property 'tags'" } }

  - name: unauthorized
    operation: tasks.list
    method: GET
    path: /tasks
    response:
      status: 401
      body: { error: { code: unauthorized, message: "missing or invalid API key" } }
