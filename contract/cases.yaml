# Fivexer /v1 contract cases
#
# Every SDK is hand-written, so drift is caught by tests rather than prevented by a generator.
# These cases document the exact request each SDK must build and the exact response it must
# parse, for a shared suite that runs them against a real /v1 server.
#
# STATUS: that runner does not exist yet. Nothing reads this file today — all four
# ContractParityTests walk `operations.yaml` instead, which is the checklist that is actually
# enforced. So `scripts/sync-contract.py` reports missing cases as a NOTE and does not fail the
# build: gating a merge on completeness nobody consumes is the same failure the contract-sync
# workflow was fixed for, a check asserting more than it verifies. Make it blocking the day the
# runner lands, and delete this paragraph.
#
# Reference implementation: platform/packages/sdk (TypeScript @fivexer/sdk).
# Auth: Authorization: Bearer sk_test_/sk_live_
# Base path: {baseUrl}/v1
# Error envelope: { "error": { "code": "...", "message": "..." } }
# Quota headers (any response): x-quota-{kind}-limit / x-quota-{kind}-remaining
#   kind ∈ { task-rate, queued-tasks, workers }; retry-after (seconds) on 429.

base_path: /v1
auth:
  header: Authorization
  scheme: Bearer

quota_headers:
  - { field: x-quota-task-rate-limit,         model: taskRateLimit }
  - { field: x-quota-task-rate-remaining,     model: taskRateRemaining }
  - { field: x-quota-queued-tasks-limit,      model: queuedTasksLimit }
  - { field: x-quota-queued-tasks-remaining,  model: queuedTasksRemaining }
  - { field: x-quota-workers-limit,           model: workersLimit }
  - { field: x-quota-workers-remaining,       model: workersRemaining }
  - { field: x-quota-skills-limit,            model: skillsLimit }
  - { field: x-quota-skills-remaining,        model: skillsRemaining }
  - { field: x-quota-worker-skills-limit,     model: workerSkillsLimit }
  - { field: x-quota-worker-skills-remaining, model: workerSkillsRemaining }

# The worker-portal plane: a `wt_` session token scoped to exactly one worker. No quota
# headers, no idempotency key. Cases below are tagged `plane: worker`; everything else is
# the workspace (`sk_`) plane.
worker_plane:
  base_path: /v1
  auth: { header: Authorization, scheme: Bearer, credential_prefix: "wt_" }

webhook:
  header: x-fivexer-signature
  format: "t=<unix-ms>,v1=<hex64>"
  algorithm: HMAC-SHA256
  message: "${timestamp}.${rawBody}"
  tolerance_ms: 300000   # ±5 min

cases:
  # ---- tasks ----
  - name: create_task_minimal
    operation: tasks.create
    method: POST
    path: /tasks
    request:
      headers: { Idempotency-Key: auto }
      body: { tags: [english, billing] }
    response:
      status: 202
      body: { id: task_8fk2, status: queued }
      quota_headers_present: true

  - name: create_task_with_priority_and_meta
    operation: tasks.create
    method: POST
    path: /tasks
    request:
      body: { tags: [english], priority: 90, meta: { ticketId: T-441 } }
    response:
      status: 202
      body: { id: task_9aa3, status: queued }

  - name: create_task_duplicate_id_conflict
    operation: tasks.create
    method: POST
    path: /tasks
    request:
      body: { id: task_8fk2, tags: [english] }
    response:
      status: 409
      body: { error: { code: task_exists, message: "task task_8fk2 already exists" } }

  - name: get_task
    operation: tasks.get
    method: GET
    path: /tasks/task_8fk2
    response:
      status: 200
      body: { id: task_8fk2, tags: [english, billing], priority: 90, status: pending, workerId: agent_1, createdAt: 1750000000000, meta: { ticketId: T-441 } }

  - name: get_task_not_found
    operation: tasks.get
    method: GET
    path: /tasks/missing
    response:
      status: 404
      body: { error: { code: not_found, message: "task not found" } }

  - name: list_tasks_default
    operation: tasks.list
    method: GET
    path: /tasks
    response:
      status: 200
      body: { tasks: [], nextCursor: null, hasMore: false }

  - name: list_tasks_filtered_paginated
    operation: tasks.list
    method: GET
    path: /tasks?status=queued&limit=50
    response:
      status: 200
      body: { tasks: [{ id: task_8fk2, tags: [english], priority: 90, status: queued, workerId: null, createdAt: 1750000000000, meta: null }], nextCursor: cursor_1, hasMore: true }

  - name: cancel_task
    operation: tasks.cancel
    method: DELETE
    path: /tasks/task_8fk2
    response:
      status: 204
      body: null

  - name: accept_task
    operation: tasks.accept
    method: POST
    path: /tasks/task_8fk2/accept
    request: { body: { workerId: agent_1 } }
    response: { status: 200, body: { id: task_8fk2, status: accepted } }

  - name: reject_task
    operation: tasks.reject
    method: POST
    path: /tasks/task_8fk2/reject
    request: { body: { workerId: agent_1 } }
    response: { status: 200, body: { id: task_8fk2, status: queued } }

  - name: complete_task
    operation: tasks.complete
    method: POST
    path: /tasks/task_8fk2/complete
    request: { body: { workerId: agent_1, result: { resolved: true } } }
    response: { status: 200, body: { id: task_8fk2, status: completed } }

  # ---- workers ----
  - name: upsert_worker_minimal
    operation: workers.upsert
