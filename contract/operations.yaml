# Fivexer SDK operation catalogue
#
# The parity checklist. Every operation the reference TypeScript SDK
# (platform/packages/sdk) exposes, with the exact wire shape each hand-written SDK must
# build. Walking this file and resolving each `name` to a method in every SDK is the
# "no gaps" proof — see the parity check in the repo README.
#
# Reference: platform/packages/sdk/src/client.ts (plane: workspace)
#            platform/packages/sdk/src/worker-client.ts (plane: worker)
#
# planes:
#   workspace — Authorization: Bearer sk_test_/sk_live_ (workspace API key).
#               Parses X-Quota-* onto client.quota; POST auto-sends an Idempotency-Key.
#   worker    — Authorization: Bearer wt_… (worker session token, one worker's scope).
#               No quota headers, no idempotency key.
#
# Field naming: `body`/`response` use the wire (camelCase) names. Language bindings
# idiomatise them (snake_case in Python, getters in Java/PHP) but the wire is fixed.
#
# `?` suffix on a body field = optional.

base_path: /v1

planes:
    workspace:
        auth: { header: Authorization, scheme: Bearer, credential: "sk_test_/sk_live_" }
        parses_quota_headers: true
        auto_idempotency_key: POST
        client: { ts: Fivexer, python: "Fivexer / AsyncFivexer", java: Fivexer, php: Fivexer }
    supervisor:
        auth: { header: Authorization, scheme: Bearer, credential: "sv_" }
        parses_quota_headers: false
        auto_idempotency_key: none
        client:
            {
                ts: FivexerSupervisor,
                python: "FivexerSupervisor / AsyncFivexerSupervisor",
                java: FivexerSupervisor,
                php: FivexerSupervisor,
            }
    worker:
        auth: { header: Authorization, scheme: Bearer, credential: "wt_" }
        parses_quota_headers: false
        auto_idempotency_key: none
        client:
            { ts: FivexerWorker, python: "FivexerWorker / AsyncFivexerWorker", java: FivexerWorker, php: FivexerWorker }

groups:
    # ─────────────────────────── tasks ───────────────────────────
    - group: tasks
      plane: workspace
      operations:
          - name: tasks.create
            method: POST
            path: /tasks
            body: CreateTaskInput
            response: "{ id, status: queued }"
            notes: 202. Auto Idempotency-Key so a transport retry is deduplicated server-side.
          - name: tasks.get
            method: GET
            path: /tasks/{id}
            response: Task
          - name: tasks.list
            method: GET
            path: /tasks
            query: "status?, cursor?, limit?"
            response: TaskPage
          - name: tasks.cancel
            method: DELETE
            path: /tasks/{id}
            response: void
          - name: tasks.accept
            method: POST
            path: /tasks/{id}/accept
            body: "{ workerId }"
            response: "{ id, status: accepted }"
          - name: tasks.reject
            method: POST
            path: /tasks/{id}/reject
            body: "{ workerId }"
            response: "{ id, status: queued }"
          - name: tasks.complete
            method: POST
            path: /tasks/{id}/complete
            body: "{ workerId, result? }"
            response: "{ id, status: completed }"
          - name: tasks.assign
            method: POST
            path: /tasks/{id}/assign
            body: "{ workerId, force? }"
            response: AssignTaskResult
            notes: >-
                Operator override. `force` bypasses paused/backlog/veto/prior-rejection checks
                (but never worker existence). `previousWorkerId` is null when the task came from
                the queue rather than another worker.
          - name: tasks.setPriority
            method: PATCH
            path: /tasks/{id}
            body: "{ priority }"
            response: "{ id, priority }"
          - name: tasks.suggestWorkers
            method: POST
            path: /tasks/suggest-workers
            body: SuggestWorkersInput
            response: SuggestWorkersResult
            notes: Dry-run scoring — returns who *would* match, without creating a task.
          - name: tasks.createMany
            method: POST
            path: /tasks/bulk
            body: "{ tasks: CreateTaskInput[] }"
            response: BulkTaskReport
            notes: >-
                Partial success is normal — a 200 does not mean every task was created. Read
                `failed` and the per-entry `results`, whose `index` maps back to the input list.
          - name: tasks.check
            method: POST
            path: /tasks/check
            body: CreateTaskInput
            response: TaskCheckReport
            notes: Dry run. Creates and reserves nothing, so it is safe on every keystroke of a form.
          - name: tasks.ack
            method: POST
            path: /tasks/{id}/ack
            body: "{ workerId }"
            response: "{ id, status: accepted }"
            notes: Acknowledge an offer without starting work — stops the response clock only.
          - name: tasks.escalate
            method: POST
            path: /tasks/{id}/escalate
            body: "{ workerId? }"
            response: "{ id, escalated, parked, escalationLevel }"
            notes: >-
                `escalated: false, parked: true` is the end of the ladder — the task has left
                matching, and this flag is the only thing that says so.
          - name: tasks.parked
            method: GET
            path: /tasks/parked
            response: "{ tasks: Task[], count }"
            notes: Out of matching (exhausted ladder, SLA park, rejection budget) but recoverable via unpark.
          - name: tasks.scheduled
            method: GET
            path: /tasks/scheduled
            response: "{ tasks: Task[], count }"
            notes: Held by a `schedule.notBefore` — the only view of work booked but not started.
          - name: tasks.unpark
            method: POST
            path: /tasks/{id}/unpark
            body: "{ resetEscalation?, resetSla?, resetSchedule? }"
            response: "{ id, status: queued }"
            notes: Reset the clocks that parked it, or the next sweep parks it straight back.

    - group: tasks.recurring
      plane: workspace
      operations:
          - name: tasks.recurring.list
            method: GET
            path: /tasks/recurring
            response: "{ recurring: RecurringTask[], count }"
            notes: >-
                Templates, soonest `nextAt` first. A template is never itself matchable and never
                appears in tasks.list, tasks.scheduled or the queue stats — its occurrences do,
                the moment the sweep cuts them.
          - name: tasks.recurring.remove
            method: DELETE
            path: /tasks/recurring/{id}
            query: "dropScheduled?"
            response: void
            notes: >-
                204. Stops the template; occurrences already materialized live on unless
                `dropScheduled=true`. 404 when no such template — removing one twice is not
                idempotent, and a caller that treats it as such will mask a wrong id.

    - group: tasks.context
      plane: workspace
      operations:
          - name: tasks.context.get
            method: GET
            path: /tasks/{id}/context
            response: TaskContext
          - name: tasks.context.set
            method: PUT
            path: /tasks/{id}/context
            body: SetTaskContextInput
            response: TaskContext
          - name: tasks.context.clear
            method: DELETE
            path: /tasks/{id}/context
            response: void

    - group: tasks.comments
      plane: workspace
      operations:
          - name: tasks.comments.add
            method: POST
            path: /tasks/{id}/comments
            body: AddCommentInput
            response: "{ comment: Comment }"
          - name: tasks.comments.list
            method: GET
            path: /tasks/{id}/comments
            query: "cursor?, limit?"
            response: CommentPage
          - name: tasks.comments.remove
            method: DELETE
            path: /tasks/{id}/comments/{commentId}
            response: void

    - group: tasks.attachments
      plane: workspace
      operations:
          - name: tasks.attachments.create
            method: POST
            path: /tasks/{id}/attachments
            body: CreateAttachmentInput
            response: "{ attachment: Attachment, upload: AttachmentUpload }"
          - name: tasks.attachments.confirm
            method: POST
            path: /tasks/{id}/attachments/{attachmentId}/confirm
            response: "{ attachment: Attachment }"
          - name: tasks.attachments.list
            method: GET
            path: /tasks/{id}/attachments
            response: "{ attachments: Attachment[] }"
          - name: tasks.attachments.download
            method: GET
            path: /tasks/{id}/attachments/{attachmentId}/download
            response: AttachmentDownload
          - name: tasks.attachments.remove
            method: DELETE
            path: /tasks/{id}/attachments/{attachmentId}
            response: void
          - name: tasks.attachments.upload
            method: composite
            path: "(create) → PUT {upload.url} → (confirm)"
            response: "{ attachment: Attachment }"
            notes: >-
                DX helper, not an endpoint. Derives sizeBytes from the payload, calls create,
                PUTs the bytes to the presigned URL with `upload.headers` sent verbatim (they are
                part of the signature), then confirms. A non-2xx from storage raises the SDK's API
                error with code `upload_failed` and the storage status.

    # ─────────────────────────── workers ───────────────────────────
    - group: workers
      plane: workspace
      operations:
          - name: workers.upsert
            method: POST
            path: /workers
            body: UpsertWorkerInput
            response: "{ id }"
            notes: Body may be empty — the API then generates the worker id.
          - name: workers.list
            method: GET
            path: /workers
            response: "{ workers: string[], count }"
          - name: workers.get
            method: GET
            path: /workers/{id}
            response: WorkerDetail
          - name: workers.patch
            method: PATCH
            path: /workers/{id}
            body: PatchWorkerInput
            response: "{ id }"
            notes: Partial in-place update — absent fields keep their stored value.
          - name: workers.setAvailability
            method: POST
            path: /workers/{id}/availability
            body: "{ available, releaseBacklog? }"
            response: "{ id, available, releasedTaskIds? }"
            notes: >-
                Pause preserves the unaccepted backlog; `releaseBacklog: true` additionally
                requeues it (accepted work is never touched) and returns `releasedTaskIds`.
                `releaseBacklog` is only valid when pausing — sending it with `available: true`
                is a 400 `invalid_body`. SDKs must only emit the field when it is true.
          - name: workers.queue
            method: GET
            path: /workers/{id}/queue
            response: WorkerQueue
          - name: workers.metrics
            method: GET
            path: /workers/{id}/metrics
            query: "window?"
            response: WorkerMetrics
            notes: >-
                The operator-plane mirror of the worker's own portal metrics: today plus a
                rolling window (default `7d`, max `30d`). Worked time comes from the shift log
                — shift time minus overlapping breaks — so both planes report the same figure.
                `acceptanceRate` is null before any offer, never zero. Requires the control plane.
          - name: workers.timeEntries
            method: GET
            path: /workers/{id}/time-entries
            query: "from?, to?"
            response: WorkerTimeEntriesResult
            notes: >-
                The recorded shift and break log for a window (default: the last 7 days). This
                is the working-time record EU employers must keep (CJEU C-55/18). The API also
                serves `format=csv`; SDKs wrap the JSON form only. Requires the control plane.
          - name: workers.remove
            method: DELETE
            path: /workers/{id}
            response: void

    # ─────────────────────────── skills ───────────────────────────
    - group: skills
      plane: workspace
      operations:
          - name: skills.create
            method: POST
            path: /skills
            body: UpsertSkillInput
            response: Skill
          - name: skills.list
            method: GET
            path: /skills
            query: "q?, limit?"
            response: "{ skills: Skill[] }"
          - name: skills.patch
            method: PATCH
            path: /skills/{id}
            body: PatchSkillInput
            response: Skill
          - name: skills.get
            method: GET
            path: /skills/{id}
            response: Skill
          - name: skills.remove
            method: DELETE
            path: /skills/{id}
            response: void
          - name: skills.suggest
            method: GET
            path: /skills/suggest
            query: "selected? (comma-joined), limit?"
            response: "{ skills: Skill[] }"
            notes: >-
                `selected` is an array in the SDK signature but a single comma-joined query
                parameter on the wire. Empty/absent array must omit the parameter entirely.

    # ─────────────────────────── decisions ───────────────────────────
    - group: decisions
      plane: workspace
      operations:
          - name: decisions.list
            method: GET
            path: /decisions
            query: "taskId?, workerId?, limit?"
            response: "{ decisions: Decision[] }"

    # ─────────────────────────── workflows ───────────────────────────
    - group: workflows
      plane: workspace
      operations:
          - name: workflows.list
            method: GET
            path: /workflows
            response: "{ workflows: WorkflowDefinitionSummary[] }"
          - name: workflows.get
            method: GET
            path: /workflows/{id}
            response: WorkflowDefinition
          - name: workflows.save
            method: PUT
            path: /workflows/{id}
            body: WorkflowDefinitionInput
            response: WorkflowDefinition
            notes: >-
                Create-or-replace. The id comes from the URL, never the body. The engine validates
                the graph (unreachable/dangling steps, missing initial step, machine handler), so a
                bad definition returns 400 `invalid_workflow`.
          - name: workflows.remove
            method: DELETE
            path: /workflows/{id}
            response: void
          - name: workflows.run
            method: POST
            path: /workflows/{id}/runs
            body: StartRunInput
            response: WorkflowRun
          - name: workflows.listRuns
            method: GET
            path: /workflows/{id}/runs
            query: "status?, cursor?, limit?"
            response: "{ runs: WorkflowRun[], nextCursor? }"

    - group: runs
      plane: workspace
      operations:
          - name: runs.list
            method: GET
            path: /workflow-runs
            query: "status?, workflowId?, cursor?, limit?"
            response: "{ runs: WorkflowRun[], nextCursor? }"
          - name: runs.get
            method: GET
            path: /workflow-runs/{runId}
            response: WorkflowRun
          - name: runs.steps
            method: GET
            path: /workflow-runs/{runId}/steps
            response: "{ runId, status, steps: WorkflowRunStep[] }"
          - name: runs.cancel
            method: POST
            path: /workflow-runs/{runId}/cancel
            response: WorkflowRun
          - name: runs.completeStep
            method: POST
            path: /workflow-runs/{runId}/steps/{stepId}/complete
            body: "{ data? }"
            response: WorkflowRun
            notes: External (callback) steps only.
          - name: runs.failStep
            method: POST
            path: /workflow-runs/{runId}/steps/{stepId}/fail
            body: "{ error? }"
            response: WorkflowRun

    # ─────────────────────────── learning ───────────────────────────
    - group: learning
      plane: workspace
      operations:
          - name: learning.status
            method: GET
            path: /learning/status
            response: LearningStatus
          - name: learning.workerStats
            method: GET
            path: /learning/workers/{workerId}
            response: WorkerLearningStats
          - name: learning.previewWeights
            method: GET
            path: /learning/weights/preview
            query: "workerId?"
            response: LearnedWeightsPreview
          - name: learning.applyWeights
            method: POST
            path: /learning/weights/apply
            body: "{ workerIds? }"
            response: "{ applied: Record<workerId, Record<tag, number>> }"
          - name: learning.revertWeights
            method: POST
            path: /learning/weights/revert
            body: "{ workerIds? }"
            response: "{ reverted, count }"
            notes: Restores each worker's snapshot; workers never synced are absent from the result.
          - name: learning.feedback
            method: POST
            path: /tasks/{taskId}/feedback
            body: TaskFeedbackInput
            response: "{ ok }"
          - name: learning.reward
            method: POST
            path: /tasks/{taskId}/reward
            body: TaskRewardInput
            response: "{ ok }"
          - name: learning.feedbackBulk
            method: POST
            path: /learning/feedback
            body: "{ items: LearningFeedbackItem[] }"
            response: "{ results: LearningFeedbackResult[] }"
            notes: Partial success — each result carries its own `ok` and optional `error`.
          - name: learning.reset
            method: POST
            path: /learning/reset
            response: "{ ok }"

    # ─────────────────────────── notifications ───────────────────────────
    - group: notifications.sequences
      plane: workspace
      operations:
          - name: notifications.sequences.list
            method: GET
            path: /notification-sequences
            response: "{ sequences: NotificationSequence[] }"
          - name: notifications.sequences.create
            method: POST
            path: /notification-sequences
            body: CreateNotificationSequenceInput
            response: NotificationSequence
          - name: notifications.sequences.get
            method: GET
            path: /notification-sequences/{id}
            response: NotificationSequence
          - name: notifications.sequences.update
            method: PATCH
            path: /notification-sequences/{id}
            body: UpdateNotificationSequenceInput
            response: NotificationSequence
          - name: notifications.sequences.remove
            method: DELETE
            path: /notification-sequences/{id}
            response: void

    - group: notifications.channels
      plane: workspace
      operations:
          - name: notifications.channels.list
            method: GET
            path: /notification-channels
            response: "{ channels: NotificationChannel[] }"
          - name: notifications.channels.create
            method: POST
            path: /notification-channels
            body: CreateNotificationChannelInput
            response: NotificationChannel
          - name: notifications.channels.get
            method: GET
            path: /notification-channels/{id}
            response: NotificationChannel
          - name: notifications.channels.update
            method: PATCH
            path: /notification-channels/{id}
            body: UpdateNotificationChannelInput
            response: NotificationChannel
          - name: notifications.channels.remove
            method: DELETE
            path: /notification-channels/{id}
            response: void

    # ─────────────────────────── teams ───────────────────────────
    - group: teams
      plane: workspace
      operations:
          - name: teams.create
            method: POST
            path: /teams
            body: UpsertTeamInput
            response: Team
            notes: >-
                A team is a routing primitive, not a label: the server derives a `tag` from the
                key, and matching sees that tag. Adding a worker changes what work reaches them.
          - name: teams.list
            method: GET
            path: /teams
            response: "{ teams: Team[] }"
          - name: teams.get
            method: GET
            path: /teams/{id}
            response: Team
          - name: teams.patch
            method: PATCH
            path: /teams/{id}
            body: "{ name?, description?, color? }"
            response: Team
            notes: "`key` is immutable — the derived routing tag would change under live matching."
          - name: teams.remove
            method: DELETE
            path: /teams/{id}
            response: void
          - name: teams.members
            method: GET
            path: /teams/{id}/members
            response: "{ teamId, members: TeamMember[] }"
          - name: teams.setMembers
            method: PUT
            path: /teams/{id}/members
            body: "{ workerIds }"
            response: "{ teamId, workerIds }"
            notes: PUT, not PATCH — a worker absent from the list is removed from the team.

    # ─────────────────────────── join links ───────────────────────────
    - group: joinLinks
      plane: workspace
      operations:
          - name: joinLinks.create
            method: POST
            path: /join-links
            body: CreateJoinLinkInput
            response: CreateJoinLinkResult
            notes: >-
                `joinUrl` is returned only here — a lost link is re-created, never recovered.
                `maxUses: null` means unlimited; 0 would mean exhausted.
          - name: joinLinks.list
            method: GET
            path: /join-links
            response: "{ links: JoinLink[] }"
          - name: joinLinks.revoke
            method: DELETE
            path: /join-links/{id}
            response: void

    # ─────────────────────────── worker identities ───────────────────────────
    - group: identities
      plane: workspace
      operations:
          - name: identities.list
            method: GET
            path: /worker-identities
            response: "{ identities: PublicWorkerIdentity[] }"
            notes: Never carries a PIN — only `hasPin`, whether one is set.
          - name: identities.invite
            method: POST
            path: /worker-identities/invite
            body: InviteWorkerIdentityInput
            response: WorkerInviteResult
            notes: >-
                Creates the worker too when it does not exist (`workerCreated`). Check
                `emailStatus`: `mailer_unconfigured` is common, and leaves `inviteUrl` as the only
                delivery path. That URL is credential-equivalent until consumed.
          - name: identities.resendInvite
            method: POST
            path: /worker-identities/{workerId}/invite/resend
            response: WorkerInviteResult
          - name: identities.create
            method: POST
            path: /workers/{workerId}/identity
            body: CreateWorkerIdentityInput
            response: "{ identity: PublicWorkerIdentity }"
            notes: Sets a PIN directly, for a worker who will never receive email (a kiosk, an agent).
          - name: identities.update
            method: PATCH
            path: /workers/{workerId}/identity
            body: "{ label?, email?, pin?, status? }"
            response: "{ identity: PublicWorkerIdentity }"
            notes: >-
                `email` is genuinely nullable: absent leaves it, null erases it. Revoking is a
                `status` patch here, not a DELETE.
          - name: identities.remove
            method: DELETE
            path: /workers/{workerId}/identity
            response: void
            notes: Removes the sign-in, not the worker — they stay routable.

    # ─────────────────────────── portal link ───────────────────────────
    - group: portal
      plane: workspace
      operations:
          - name: portal
            method: GET
            path: /portal
            response: WorkerPortalLink
            notes: >-
                Top-level method, not a resource group. A workspace with no published bundle is a
                normal state (`exists: false`), not an error.

    # ─────────────────────────── stats ───────────────────────────
    - group: stats
      plane: workspace
      operations:
          - name: stats
            method: GET
            path: /stats
            response: WorkspaceStats
            notes: Top-level method, not a resource group (mirrors the reference SDK).
          - name: slaStats
            method: GET
            path: /stats/sla
            query: "tag?"
            response: SlaStats
            notes: >-
                `acceptanceRate` is null until at least one offer is recorded — 0.0 ("everyone
                missed") and null ("nothing measured") are different answers.
          - name: queueAudit
            method: GET
            path: /stats/queue-audit
            query: "limit?, minWaitingMs?, includeHealthy?"
            response: QueueAuditReport
            notes: Walks the queue against the live roster — dashboard cadence, not per-request.
          - name: history.timeseries
            method: GET
            path: /stats/timeseries
            query: "from?, to?, bucket?"
            response: StatsTimeseriesResult
            notes: Requires the control plane; 501 `history_unavailable` on data-plane-only deployments.
          - name: history.workers
            method: GET
            path: /stats/workers
            query: "from?, to?, bucket?, teamId?"
            response: WorkerStatsResult
            notes: >-
                Requires the control plane. One row per worker, merging three sources: the task
                archive (completed/cancelled, avg + p50/p95 handle), the synced day counters
                (offered/accepted/rejected/failed/expired/released, acceptanceRate) and the shift
                log (onShiftMs/breakMs/workingMs/shiftCount, utilization = handle ÷ worked).
                The row set is their union, so a worker who was on shift and finished nothing
                still appears with zeros.
          - name: history.workerTimeseries
            method: GET
            path: /stats/workers/{workerId}/timeseries
            query: "from?, to?, bucket?"
            response: WorkerTimeseriesResult
            notes: >-
                Per-worker twin of history.timeseries. Worked time and lifecycle counters are
                day-grained, so they appear only on `bucket=day` buckets — never on hour buckets.
                Requires the control plane.
          - name: team.presence
            method: GET
            path: /team/presence
            query: "teamId?"
            response: TeamPresence
            notes: Supervisor view of the same data workers see via the portal plane. Requires the control plane.
          - name: breaks.metrics
            method: GET
            path: /breaks/metrics
            query: "from?, to?, teamId?, workerId?"
            response: WorkspaceBreakMetrics
            notes: >-
                Requires the control plane. With an explicit `to`, durations are clipped to the
                window; without one, open breaks are measured to now.

    # ─────────────────────────── worker portal plane ───────────────────────────
    - group: worker.auth
      plane: worker
      operations:
          - name: worker.login
            method: POST
            path: /worker-auth/login
            body: WorkerLoginInput
            response: WorkerSessionToken
            notes: >-
                Unauthenticated (no token yet). On success the client adopts the returned `wt_`
                token AND the `workerId` from the request, so later calls need no explicit id.
          - name: worker.logout
            method: POST
            path: /worker-auth/logout
            response: void
            notes: Revokes the session; the client must forget the token even though the body is empty.

    - group: worker.tasks
      plane: worker
      operations:
          - name: worker.queue
            method: GET
            path: /portal/workers/{id}/queue
            response: WorkerQueue
            notes: "`id` defaults to the logged-in worker; calling without a login or explicit id is a client-side error (`worker_id_required`), not a request."
          - name: worker.taskDetail
            method: GET
            path: /portal/tasks/{id}
            response: WorkerTaskDetail
            notes: 404 for another worker's task — the token's scope is enforced server-side.
          - name: worker.accept
            method: POST
            path: /portal/tasks/{id}/accept
            body: "{ workerId }"
            response: WorkerTaskResult
          - name: worker.reject
            method: POST
            path: /portal/tasks/{id}/reject
            body: "{ workerId }"
            response: WorkerTaskResult
          - name: worker.complete
            method: POST
            path: /portal/tasks/{id}/complete
            body: "{ workerId, result? }"
            response: WorkerTaskResult

    - group: worker.breaks
      plane: worker
      operations:
          - name: worker.startBreak
            method: POST
            path: /portal/breaks/start
            body: "{ reason? }"
            response: WorkerBreakStarted
            notes: 409 when a break is already open. Pauses routing but keeps the current backlog.
          - name: worker.endBreak
            method: POST
            path: /portal/breaks/end
            response: "WorkerBreakEnded | null"
            notes: The API returns 204 when no break was open — SDKs must surface that as null/absent, not an error.
          - name: worker.breaksToday
            method: GET
            path: /portal/breaks/today
            response: WorkerBreakToday
          - name: worker.metricsToday
            method: GET
            path: /portal/metrics/today
            response: WorkerMetricsToday
            notes: >-
                `workingMs` is real worked time (shift minus breaks) once the shift log has
                today's rows; workers predating it keep the old since-midnight approximation.
                `onShiftMs`/`shiftCount` are additive — absent from older servers.
          - name: worker.timeEntries
            method: GET
            path: /portal/me/time-entries
            response: WorkerTimeEntriesResult
            notes: >-
                The worker's own copy of the record an operator reads through
                `workers.timeEntries` — fixed to the last 7 days, no parameters. That parity is
                deliberate: it is what keeps the log a timesheet rather than surveillance.
          - name: worker.teamPresence
            method: GET
            path: /portal/team/presence
            response: TeamPresence
            notes: Visible to every worker in the workspace — the information-sharing surface.

    - group: worker.session
      plane: worker
      operations:
          - name: worker.refresh
            method: POST
            path: /worker-auth/refresh
            response: WorkerSessionToken
            notes: >-
                Rotates in place. A 4xx means "re-authenticate" and returns false rather than
                throwing; anything else (5xx, network, an older server with no route) propagates,
                leaving the current token usable for the caller's own retry.
          - name: worker.join
            method: POST
            path: /worker-auth/join
            body: JoinWorkspaceInput
            response: JoinWorkspaceResult
            notes: >-
                Unauthenticated. The worker id is server-generated — show it to them, it is their
                PIN-login username. The client adopts the returned session. `pendingApproval`
                means no work routes until an operator admits them.
          - name: worker.acceptInvite
            method: POST
            path: /worker-auth/accept-invite
            body: "{ token, pin }"
            response: AcceptWorkerInviteResult
            notes: >-
                Unauthenticated, single-use token (replay is 400 `invalid_token`, same as expiry).
                Setting the PIN signs them in, so the client adopts the returned session — the
                whole point of the magic link is not retyping credentials afterwards.

    - group: worker.profile
      plane: worker
      operations:
          - name: worker.me
            method: GET
            path: /portal/me
            response: WorkerMe
            notes: Works on data-plane-only deployments, where break/team endpoints 501.
          - name: worker.setAvailability
            method: POST
            path: /portal/me/availability
            body: "{ available, staleAfterMs? }"
            response: "{ workerId, available }"
            notes: >-
                Workers are created off shift, so this is what makes someone matchable at all.
                403 `approval_pending` while an operator must still admit a QR-join worker.
                `staleAfterMs` (60_000–86_400_000) is a liveness contract for **unattended**
                workers only: the platform clocks the worker out and pauses routing after that
                much silence, which is what stops a crashed process reading as available
                forever. An interactive client must never send it — a person working away from
                their phone is not a crashed process. Only meaningful with `available: true`.
          - name: worker.changePin
            method: POST
            path: /portal/me/pin
            body: "{ currentPin, newPin }"
            response: void
            notes: A wrong current PIN is 400 `invalid_current_pin`; the session survives either way.
          - name: worker.skillCatalog
            method: GET
            path: /portal/skills
            response: "{ skills: Skill[] }"
            notes: Read-only — inventing a skill is an operator's decision.
          - name: worker.setSkills
            method: PUT
            path: /portal/me/skills
            body: "{ skills: { skillId, level }[] }"
            response: "{ workerId, skills: WorkerSkill[] }"
            notes: Replaces the whole set. Does not change shift state; that stays a separate claim.
          - name: worker.metricsWindow
            method: GET
            path: /portal/metrics
            query: "window?"
            response: WorkerMetricsWindow
            notes: Defaults to `7d`. Medians are null for a worker with no history, not zero.
          - name: worker.updateLocation
            method: POST
            path: /portal/workers/me/location
            body: "{ latitude, longitude }"
            response: WorkerLocationResult
            notes: Rate-limited server-side (~1 per 10s) to keep churn off the matching plane.

    - group: worker.comments
      plane: worker
      operations:
          - name: worker.comments
            method: GET
            path: /portal/tasks/{id}/comments
            query: "cursor?, limit?"
            response: CommentPage
          - name: worker.addComment
            method: POST
            path: /portal/tasks/{id}/comments
            body: "{ body }"
            response: "{ comment: Comment }"

    - group: worker.attachments
      plane: worker
      operations:
          - name: worker.attachments.create
            method: POST
            path: /portal/tasks/{id}/attachments
            body: "{ filename, contentType, sizeBytes }"
            response: "{ attachment: Attachment, upload: AttachmentUpload }"
            notes: >-
                The same storage core as the workspace plane's, minus the `uploadedBy` input —
                on this plane the uploader is the session, so a worker cannot attribute a file
                to anyone else.
          - name: worker.attachments.confirm
            method: POST
            path: /portal/tasks/{id}/attachments/{attachmentId}/confirm
            response: "{ attachment: Attachment }"
          - name: worker.attachments.list
            method: GET
            path: /portal/tasks/{id}/attachments
            response: "{ attachments: Attachment[] }"
          - name: worker.attachments.download
            method: GET
            path: /portal/tasks/{id}/attachments/{attachmentId}/download
            response: AttachmentDownload
          - name: worker.attachments.upload
            method: composite
            path: "(create) → PUT {upload.url} → (confirm)"
            response: "{ attachment: Attachment }"
            notes: >-
                DX helper, not an endpoint — the worker-plane twin of tasks.attachments.upload.
      notes: >-
          There is deliberately no `remove` on this plane. Files on a task are an operator's to
          manage and a worker's only to add and read; a delete here would let a worker erase the
          evidence of their own work.

    - group: worker.voice
      plane: worker
      operations:
          - name: worker.voiceIce
            method: GET
            path: /portal/voice/ice
            response: "{ iceServers: VoiceIceServer[] }"
            notes: >-
                **Experimental — voice is not production-ready.** May change or be withdrawn in a
                patch release. Fetched per call, never cached: a TURN credential is short-lived and
                a stale one fails once the call is already ringing. 404 `voice_disabled` where the
                workspace has voice switched off — a configuration fact, not an error to retry, and
                not to be flattened into an empty server list.

    - group: worker.push
      plane: worker
      operations:
          - name: worker.registerDevice
            method: POST
            path: /portal/devices
            body: "{ token, platform }"
            response: WorkerDevice
            notes: An Expo push token from the native app. Browsers use pushSubscribe instead.
          - name: worker.unregisterDevice
            method: DELETE
            path: /portal/devices
            body: "{ token }"
            response: void
          - name: worker.pushConfig
            method: GET
            path: /portal/push/config
            response: "{ enabled, publicKey }"
            notes: >-
                `enabled: false` is a deployment fact, not an error. Read it before prompting for
                notification permission — a browser gives you one prompt.
          - name: worker.pushSubscribe
            method: POST
            path: /portal/push/subscriptions
            body: "{ endpoint, keys: { p256dh, auth } }"
            response: "{ endpoint, createdAt }"
          - name: worker.pushUnsubscribe
            method: DELETE
            path: /portal/push/subscriptions
            body: "{ endpoint }"
            response: void
            notes: >-
                Endpoint only — by the time a browser fires `pushsubscriptionchange` it has
                already discarded the keys, so requiring them would break the case this exists for.

    # ─────────────────────────── supervisor plane ───────────────────────────
    - group: supervisor.session
      plane: supervisor
      operations:
          - name: supervisor.entry
            method: GET
            path: /supervisor-auth/entry
            response: "{ consoleUrl }"
            notes: >-
                Unauthenticated, and takes no workspace id on purpose: echoing back a
                caller-supplied one would turn it into an existence oracle. `consoleUrl` is null
                when the deployment declares no dashboard origin.
          - name: supervisor.acceptInvite
            method: POST
            path: /supervisor-auth/accept
            body: "{ token }"
            response: SupervisorSession
            notes: >-
                Unauthenticated, single-use. Expired / already-used / revoked / never-existed all
                answer with the same 400 `invalid_token` — any distinction tells a grinder which
                half of a guess was right. `expiresAt` is epoch-MILLISECONDS here, not the ISO
                string the worker plane sends; the clients mirror that rather than normalising it.
          - name: supervisor.logout
            method: POST
            path: /supervisor-auth/logout
            response: void
            notes: >-
                Also drops this supervisor's push subscriptions server-side — a handed-over phone
                must stop buzzing with another crew's work, so this is one trust boundary.

    - group: supervisor.board
      plane: supervisor
      operations:
          - name: supervisor.me
            method: GET
            path: /supervisor/me
            response: SupervisorMe
            notes: "`teamKey: null` is a real answer — it means the whole workspace."
          - name: supervisor.overview
            method: GET
            path: /supervisor/overview
            response: SupervisorOverview
            notes: >-
                Counts, crew (busiest first) and parked work in one response. Deliberately one
                endpoint rather than four: this is a phone on a depot floor, and four round trips
                over a bad connection show a board that assembles itself in pieces. `parked` is
                capped at 50 server-side for the same reason.

    - group: supervisor.actions
      plane: supervisor
      operations:
          - name: supervisor.unpark
            method: POST
            path: /supervisor/tasks/{id}/unpark
            body: "{ resetEscalation?, resetSla?, resetSchedule? }"
            response: "{ id, status: queued }"
          - name: supervisor.setPriority
            method: POST
            path: /supervisor/tasks/{id}/priority
            body: "{ priority }"
            response: "{ id, priority }"
          - name: supervisor.assign
            method: POST
            path: /supervisor/tasks/{id}/assign
            body: "{ workerId, force? }"
            response: "{ id, workerId, status: pending }"
            notes: >-
                Both ends are scope-checked: a crew lead cannot push their crew's work onto
                another crew, or pull another crew's in. A matcher refusal surfaces as 400
                `assign_blocked`; out-of-scope is a 403.
          - name: supervisor.setAvailability
            method: POST
            path: /supervisor/workers/{workerId}/availability
            body: "{ available, releaseBacklog? }"
            response: SupervisorAvailabilityResult
            notes: >-
                Pausing never releases implicitly. `releaseBacklog` is the explicit redistribution
                move and only *pending* work moves; accepted work stays with whoever accepted it.

    - group: supervisor.voice
      plane: supervisor
      operations:
          - name: supervisor.voiceIce
            method: GET
            path: /supervisor/voice/ice
            response: "{ iceServers: VoiceIceServer[] }"
            notes: >-
                **Experimental — voice is not production-ready.** Same contract as the worker
                plane's, against the supervisor session.

    - group: supervisor.push
      plane: supervisor
      operations:
          - name: supervisor.pushConfig
            method: GET
            path: /supervisor/push/config
            response: "{ enabled, publicKey }"
          - name: supervisor.pushSubscribe
            method: POST
            path: /supervisor/push/subscriptions
            body: "{ endpoint, keys: { p256dh, auth } }"
            response: "{ ok: true }"
            notes: >-
                A bare ack, unlike the worker plane's `{ endpoint, createdAt }` — the supervisor
                table is keyed by endpoint and has nothing else to hand back.
          - name: supervisor.pushUnsubscribe
            method: DELETE
            path: /supervisor/push/subscriptions
            body: "{ endpoint }"
            response: void

# ─────────────────────────── not SDK operations ───────────────────────────
# Paths that exist under /v1 but are deliberately absent from every SDK. Listed so the
# contract gate can tell "covered" from "forgotten" — an unlisted path is a gap, one here is
# a decision. `sdk: false` keeps them out of the parity checks.
excluded:
    - path: /v1/worker-auth/invite
      methods: [GET]
      sdk: false
      reason: >-
          Returns a branded HTML set-your-PIN page, not JSON. It is the target a worker's email
          client opens; the SDK operation for the flow is worker.acceptInvite (the POST).
    - path: /v1/worker-auth/join
      methods: [GET]
      sdk: false
      reason: >-
          Returns the HTML self-registration page behind a QR code. The SDK operation is
          worker.join (the POST).

# ─────────────────────────── non-HTTP surface ───────────────────────────
helpers:
    - name: webhook.constructEvent
      description: >-
          Verify the `x-fivexer-signature` header (HMAC-SHA256 over `${timestamp}.${rawBody}`,
          ±5 min replay window, constant-time compare) and return the parsed event. Pure — no
          client, no network.
    - name: client.quota
      description: >-
          Latest X-Quota-* snapshot from any workspace-plane response, success or error. Errors
          raised from 402/429 carry the same snapshot so callers can back off.
