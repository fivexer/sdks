plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
}

// Maven Central verifies a namespace against the reversed domain, so the groupId is a claim
// about a domain you control: `com.fivexer` is checked by a DNS TXT record on fivexer.com.
// `io.fivexer` would require fivexer.io, which does not exist.
group = 'com.fivexer'
version = '0.4.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

ext {
    okhttpVersion = '4.12.0'
    gsonVersion = '2.11.0'
}

dependencies {
    // OkHttp: lightweight, Android-friendly HTTP. Gson: JSON (de)serialization.
    api "com.squareup.okhttp3:okhttp:${okhttpVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Project-level coverage gate: lines and branches must reach 90%.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Werror'
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// ---- Maven Central publishing (Central Portal). Credentials + signing key are CI secrets. ----
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'fivexer-sdk'
            pom {
                name = 'Fivexer SDK'
                description = 'Typed Java/JVM client for the Fivexer Platform /v1 routing API'
                url = 'https://5xer.com'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer { name = 'Fivexer' }
                }
                scm {
                    connection = 'scm:git:git://github.com/fivexer/sdks.git'
                    developerConnection = 'scm:git:ssh://github.com/fivexer/sdks.git'
                    url = 'https://github.com/fivexer/sdks'
                }
            }
        }
    }
    repositories {
        // A local directory, not a remote URL, and that is not a workaround — the Central Portal
        // has no deploy URL for releases. `central.sonatype.com/repository/maven-snapshots/`
        // accepts only -SNAPSHOT versions; a release is a zip of a Maven-repository layout
        // POSTed to the Publisher API. Staging to a directory *is* that layout, so this repo
        // builds the bundle's contents and `centralBundle` packs them.
        maven {
            name = 'centralBundle'
            url = layout.buildDirectory.dir('central-staging')
        }
    }
}

signing {
    def signingKey = System.getenv('SIGNING_KEY')
    def signingPassword = System.getenv('SIGNING_PASSWORD')
    // Central rejects unsigned artifacts, but a laptop has no signing key and `./gradlew build`
    // must still work. `required` resolves the tension: the signature is mandatory whenever
    // something is being published and skipped otherwise — so CI cannot accidentally ship an
    // unsigned jar just because a secret went missing.
    required { signingKey != null && gradle.taskGraph.allTasks.any { it.name.startsWith('publish') } }
    if (signingKey != null) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}

// The artefact the Publisher API actually consumes.
tasks.register('centralBundle', Zip) {
    description = 'Packs the signed artifacts into a Central Portal upload bundle.'
    group = 'publishing'
    dependsOn tasks.named('publishMavenJavaPublicationToCentralBundleRepository')
    from layout.buildDirectory.dir('central-staging')
    // Central validates the bundle's file list and rejects repository-level index files, which
    // describe a whole repo rather than one deployment. Gradle writes them for a file repo.
    exclude '**/maven-metadata.xml*'
    archiveFileName = "fivexer-sdk-${version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
}
